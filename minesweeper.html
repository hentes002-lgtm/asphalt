<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Gifts</title>
<style>
:root{
  color-scheme:dark;
  --bg:#141414;--panel:#1d1d1d;--line:#2e2e2e;--text:#ece6d6;--muted:#9a937f;
  --gold:#e8b437;--gold-d:#a8791a;--gold-l:#f6d77c;
  --hid:#262626;--hid-edge:#3a3a3a;--hid-hover:#5a4a20;
  --empty:#3a3322;--empty-edge:#5c4d28;
  --warn:#3d2f12;--warn-edge:#e8b437;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-align:center}
.sub{margin:0 0 18px;text-align:center;color:var(--muted);font-size:13px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px}
.chip b{color:var(--gold);font-variant-numeric:tabular-nums}
.gifts{display:inline-flex;gap:4px;vertical-align:-3px;margin-left:6px}
.gifts i{width:16px;height:16px;border-radius:3px;background:var(--hid-edge);display:inline-block}
.gifts i.on{background:var(--gold)}
button.btn{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;padding:7px 14px;border:1px solid var(--gold-d);background:transparent;color:var(--gold-l)}
button.btn:hover{background:#2a2310}
button.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.btn.ghost{border-color:var(--line);color:var(--muted)}
button.btn.ghost:hover{color:var(--text);background:#222}

.board{position:relative;width:100%;aspect-ratio:9 / 4.6188;margin:0 auto;user-select:none;-webkit-user-select:none}
.tile{position:absolute;width:11.111%;height:25%;padding:0;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.tile .hex,.tile .face{position:absolute;inset:3.5%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.tile .hex{background:var(--hid-edge);transition:background .15s}
.tile .face{inset:7.5%;background:var(--hid);display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--gold);font-size:clamp(14px,3.6vw,30px)}
.tile:hover:not([disabled]) .hex,.tile:focus-visible .hex{background:var(--gold-d)}
.tile:focus-visible{outline:none}
.tile:focus-visible .face{background:#2d2717}
.tile.empty .hex{background:var(--empty-edge)}
.tile.empty .face{background:var(--empty)}
.tile.warn .hex{background:var(--warn-edge)}
.tile.warn .face{background:var(--warn)}
.tile.gift .hex{background:var(--gold-l)}
.tile.gift .face{background:var(--gold)}
.tile.gift svg{width:52%;height:52%}
.tile.can .face::after{content:"";position:absolute;inset:38%;border-radius:50%;border:2px dotted var(--empty-edge)}
.tile[disabled]{cursor:default}
.board.over .tile.hidden .face{background:#1c1c1c}
.board.over .tile.hidden .hex{background:#2a2a2a}
.flip .face{animation:flip .32s ease-out}
.pulse .face{animation:nudge .25s}
@keyframes flip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-4%)}70%{transform:translateX(4%)}}
@media (prefers-reduced-motion:reduce){.flip .face,.pulse .face{animation:none}}

.stats{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.stats h2{margin:0 0 12px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:#181818;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.hist{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.hist em{font-style:normal;background:#181818;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--text);font-variant-numeric:tabular-nums}
.hist em.last{border-color:var(--gold-d);color:var(--gold-l)}
.statfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.statfoot small{color:var(--muted)}
.empty-note{color:var(--muted);font-size:14px;margin:0}
.runs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0 0 16px}
.run{border:1px solid var(--gold);background:#2a2310;border-radius:10px;padding:12px 14px}
.run h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-l);font-weight:600}
.run .big{font-size:30px;font-weight:700;color:var(--gold-l);font-variant-numeric:tabular-nums;line-height:1.1}
.run .big small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.rrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0;font-variant-numeric:tabular-nums}
.rrow span{color:var(--muted)}
.prog{height:6px;border-radius:3px;background:#1a1a1a;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}

.banner{display:none;margin:0 0 14px;padding:12px 14px;border-radius:10px;border:1px solid var(--gold-d);background:#2a2310;
  align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner.show{display:flex}
.banner p{margin:0}
.banner b{color:var(--gold-l)}

.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>Find the gifts</h1>
  <p class="sub">3 gifts are hidden under 42 tiles. Find them in as few clicks as you can.</p>

  <div class="banner" id="banner" role="status">
    <p id="bannerText"></p>
    <button class="btn" id="againBtn" type="button">Play again</button>
  </div>

  <div class="hud">
    <div class="chips">
      <div class="chip">Clicks <b id="clicks">0</b></div>
      <div class="chip">Gifts <b id="found">0</b>/3<span class="gifts" id="giftDots"><i></i><i></i><i></i></span></div>
    </div>
    <button class="btn ghost" id="newBtn" type="button">New board</button>
  </div>

  <div class="board" id="board" role="grid" aria-label="Game board"></div>

  <div class="legend">
    <span style="--c:var(--gold)">Gift</span>
    <span style="--c:var(--warn-edge)">! hidden gift next to it</span>
    <span style="--c:var(--empty-edge)">Empty, no gift around</span>
  </div>

  <section class="stats" aria-labelledby="statsTitle">
    <h2 id="statsTitle">Previous games</h2>
    <div class="runs" id="runs"></div>
    <div id="statsBody"></div>
    <div class="statfoot">
      <small>Saved in this browser.</small>
      <button class="btn ghost" id="resetBtn" type="button">Reset statistics</button>
    </div>
  </section>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

<script>
(() => {
  'use strict';

  const ROWS = 5, COLS = 17, GIFTS = 3;
  const STORE_KEY = 'hexGifts.stats.v1';
  const HISTORY_SHOWN = 12;

  const GIFT_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5a3d05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';

  const $ = id => document.getElementById(id);
  const boardEl = $('board');

  /* ---------- Board geometry ----------
     Rows 1,3,5: 8 tiles in even columns 2..16
     Rows 2,4:   9 tiles in odd columns 1..17
     Neighbours: (r, c±2), (r±1, c±1)                                   */
  const tiles = [];
  const byPos = new Map();
  const key = (r, c) => r * 100 + c;

  for (let r = 1; r <= ROWS; r++) {
    const start = r % 2 === 0 ? 1 : 2;
    for (let c = start; c <= COLS; c += 2) {
      const t = { r, c, gift: false, revealed: false, el: null, nb: [] };
      tiles.push(t);
      byPos.set(key(r, c), t);
    }
  }
  tiles.forEach(t => {
    [[0, -2], [0, 2], [-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([dr, dc]) => {
      const n = byPos.get(key(t.r + dr, t.c + dc));
      if (n) t.nb.push(n);
    });
  });

  /* ---------- Build DOM ---------- */
  tiles.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile hidden';
    b.style.left = ((t.c - 1) * 100 / 18) + '%';
    b.style.top = ((t.r - 1) * 18.75) + '%';
    b.innerHTML = '<span class="hex"></span><span class="face"></span>';
    b.dataset.i = i;
    t.el = b;
    t.face = b.querySelector('.face');
    boardEl.appendChild(b);
  });

  /* ---------- State ---------- */
  let clicks = 0, found = 0, over = false;

  const hiddenGiftNear = t => t.nb.some(n => n.gift && !n.revealed);
  const hasHiddenNb = t => t.nb.some(n => !n.revealed);

  function newGame() {
    tiles.forEach(t => { t.gift = false; t.revealed = false; });
    const pool = tiles.slice();
    for (let k = 0; k < GIFTS; k++) {
      const j = Math.floor(Math.random() * pool.length);
      pool.splice(j, 1)[0].gift = true;
    }
    clicks = 0; found = 0; over = false;
    boardEl.classList.remove('over');
    $('banner').classList.remove('show');
    renderAll(new Set());
    renderHud();
    renderStats(null);
  }

  /* ---------- Rules ---------- */
  function play(t) {
    if (over) return;
    const flipped = new Set();

    if (!t.revealed) {
      clicks++;
      t.revealed = true; flipped.add(t);
      if (t.gift) {
        found++;                                   // Rule 1: gift, nothing else flips
      } else if (!hiddenGiftNear(t)) {             // Rule 3: flip all neighbours (no cascade)
        t.nb.forEach(n => { if (!n.revealed) { n.revealed = true; flipped.add(n); } });
      }                                            // Rule 2: shows "!" via render
    } else if (!t.gift && !hiddenGiftNear(t) && hasHiddenNb(t)) {
      // A revealed empty tile (e.g. a former "!") whose neighbourhood is now clear:
      // clicking it applies rule 3 to its hidden neighbours. Counts as a click.
      clicks++;
      t.nb.forEach(n => { if (!n.revealed) { n.revealed = true; flipped.add(n); } });
    } else {
      nudge(t);
      return;
    }

    renderAll(flipped);
    renderHud();
    announce(t);

    if (found === GIFTS) finish();
  }

  function finish() {
    over = true;
    boardEl.classList.add('over');
    const stats = saveGame(clicks);
    const per = (clicks / GIFTS).toFixed(2);
    const best = stats.length > 1 && clicks <= Math.min(...stats.slice(0, -1).map(g => g.clicks));
    $('bannerText').innerHTML = `All 3 gifts found in <b>${clicks}</b> clicks (<b>${per}</b> per gift).` + (best ? ' New best!' : '');
    $('banner').classList.add('show');
    renderAll(new Set());
    renderStats(stats.length - 1);
    $('againBtn').focus();
  }

  /* ---------- Rendering ---------- */
  function renderTile(t, flipped) {
    const el = t.el;
    let state = 'hidden', label = `Row ${t.r}, column ${t.c}, hidden`, content = '';
    let can = false;
    if (t.revealed) {
      if (t.gift) { state = 'gift'; content = GIFT_SVG; label = `Row ${t.r}, column ${t.c}, gift`; }
      else if (hiddenGiftNear(t)) { state = 'warn'; content = '!'; label = `Row ${t.r}, column ${t.c}, gift nearby`; }
      else {
        state = 'empty'; label = `Row ${t.r}, column ${t.c}, empty`;
        can = !over && hasHiddenNb(t);
        if (can) label += ', click to flip neighbours';
      }
    }
    el.className = 'tile ' + state + (can ? ' can' : '');
    if (t.face.innerHTML !== content) t.face.innerHTML = content;
    el.setAttribute('aria-label', label);
    el.disabled = over || (t.revealed && !can);
    if (flipped.has(t)) {
      void el.offsetWidth;
      el.classList.add('flip');
    }
  }
  function renderAll(flipped) { tiles.forEach(t => renderTile(t, flipped)); }

  function renderHud() {
    $('clicks').textContent = clicks;
    $('found').textContent = found;
    [...$('giftDots').children].forEach((d, i) => d.classList.toggle('on', i < found));
  }

  function nudge(t) {
    t.el.classList.remove('pulse');
    void t.el.offsetWidth;
    t.el.classList.add('pulse');
  }

  function announce(t) {
    const s = t.gift ? `Gift found! ${found} of 3.` : hiddenGiftNear(t) ? 'A gift is nearby.' : 'Empty area.';
    $('live').textContent = `${s} Clicks: ${clicks}.`;
  }

  /* ---------- Statistics ---------- */
  function loadStats() {
    try {
      const v = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(v) ? v.filter(g => g && Number.isFinite(g.clicks) && g.clicks > 0) : [];
    } catch (e) { return memStats; }
  }
  let memStats = [];
  function saveGame(n) {
    const s = loadStats();
    s.push({ clicks: n, at: Date.now() });
    memStats = s;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
    return s;
  }
  function resetStats() {
    memStats = [];
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    renderStats(null);
  }

  /* Clicks needed to clear 5 / 30 boards, from the player's own games */
  const RUNS = [5, 30];
  function renderRuns(s) {
    const n = s.length;
    const total = s.reduce((a, g) => a + g.clicks, 0);
    $('runs').innerHTML = RUNS.map(N => {
      const row = (l, v) => `<div class="rrow"><span>${l}</span><b>${v}</b></div>`;
      let body;
      if (n >= N) {
        const c = s.map(g => g.clicks);
        let win = c.slice(0, N).reduce((a, b) => a + b, 0), best = win;
        for (let i = N; i < c.length; i++) { win += c[i] - c[i - N]; best = Math.min(best, win); }
        const last = c.slice(-N).reduce((a, b) => a + b, 0);
        body = `<div class="big">${last}<small>clicks, last ${N} boards</small></div>` +
          row(`Best ${N} in a row`, best) +
          row('Per board / per gift', `${(last / N).toFixed(2)} / ${(last / N / GIFTS).toFixed(2)}`);
      } else if (n > 0) {
        const est = Math.round(total / n * N);
        body = `<div class="big">~${est}<small>clicks, projected</small></div>` +
          row('Based on', `${n} game${n === 1 ? '' : 's'} so far`) +
          row(`Boards to a real ${N}-board result`, N - n) +
          `<div class="prog"><i style="width:${(n / N * 100).toFixed(1)}%"></i></div>`;
      } else {
        body = `<div class="big">—<small>no games yet</small></div>` +
          row(`Boards to a real ${N}-board result`, N) +
          '<div class="prog"><i style="width:0"></i></div>';
      }
      return `<div class="run"><h3>Your luck — ${N} boards</h3>${body}</div>`;
    }).join('');
  }

  function renderStats(highlightIdx) {
    const s = loadStats();
    renderRuns(s);
    const body = $('statsBody');
    if (!s.length) {
      body.innerHTML = '<p class="empty-note">No finished games yet. Your results will appear here.</p>';
      $('resetBtn').disabled = true;
      return;
    }
    $('resetBtn').disabled = false;
    const total = s.reduce((a, g) => a + g.clicks, 0);
    const games = s.length;
    const last = s[games - 1].clicks;
    const best = Math.min(...s.map(g => g.clicks));
    const avg = total / games;
    const perGift = total / (games * GIFTS);
    const card = (l, v) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`;
    const recent = s.slice(-HISTORY_SHOWN);
    const offset = games - recent.length;
    body.innerHTML =
      '<div class="grid">' +
        card('Games played', games) +
        card('Total clicks', total) +
        card('Avg clicks / board', avg.toFixed(1)) +
        card('Avg clicks / gift', perGift.toFixed(2)) +
        card('Last board', last) +
        card('Best board', best) +
      '</div>' +
      '<div class="hist">Clicks per board (latest ' + recent.length + '): ' +
        recent.map((g, i) => `<em class="${offset + i === highlightIdx ? 'last' : ''}">${g.clicks}</em>`).join('') +
      '</div>';
  }

  /* ---------- Events ---------- */
  boardEl.addEventListener('click', e => {
    const b = e.target.closest('.tile');
    if (b) play(tiles[+b.dataset.i]);
  });
  boardEl.addEventListener('animationend', e => {
    const b = e.target.closest('.tile');
    if (b) b.classList.remove('flip', 'pulse');
  });
  $('newBtn').addEventListener('click', () => {
    if (!over && clicks > 0 && !confirm('Abandon this board? It will not be counted in the statistics.')) return;
    newGame();
  });
  $('againBtn').addEventListener('click', newGame);
  $('resetBtn').addEventListener('click', () => {
    if (confirm('Reset all statistics? This cannot be undone.')) resetStats();
  });

  newGame();
})();
</script>
</body>
</html>
